<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Zumbilândia</title>
<meta name="versao" content="06e8161a01">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2b2236">
<style>
  @font-face{font-family:"Atkinson Hyperlegible";font-style:normal;font-weight:400;font-display:swap;src:url(lib/fonts/AtkinsonHyperlegible-Regular.woff2) format("woff2")}
  @font-face{font-family:"Pixelify Sans";font-style:normal;font-weight:400 700;font-display:swap;src:url(lib/fonts/PixelifySans-Regular.woff2) format("woff2")}
  html,body{margin:0;height:100%;overflow:hidden;background:#000;touch-action:none;user-select:none;-webkit-user-select:none;font-family:monospace;color:#eee}
  #c{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}
  #ui{position:fixed;inset:0;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  #rot{display:none;position:fixed;inset:0;z-index:9999;background:#2b2236;color:#fff1e0;font-family:'Atkinson Hyperlegible',sans-serif;font-size:18px;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center}
  #rot i{width:36px;height:60px;border:4px solid #fff1e0;border-radius:8px;box-sizing:border-box;animation:girar 2.4s ease-in-out infinite}
  @keyframes girar{0%,20%{transform:rotate(0)}50%,80%{transform:rotate(90deg)}100%{transform:rotate(0)}}
  @media (orientation: portrait){#rot{display:flex}}
</style>
<script type="importmap">{"imports":{"three":"./lib/three.module.min.js"}}</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui"></div>
<div id="rot"><i></i><span>Gire o celular</span></div>
<!--
CONTRATO (ver PLANO.md):
  game.js  -> window.G   (estado + regras). Unico que muta G, exceto G.input (escrito por ui.js).
  render.js-> window.R   R.init(canvas), R.draw(G)  -- so le G
  ui.js    -> window.UI  UI.init(rootDiv), UI.draw(G) -- escreve G.input, chama G.useItem/G.switchWeapon/G.restart
-->
<script src="game.js"></script>
<script src="ui.js"></script>
<script src="sfx.js"></script>
<script type="module">
  import './render.js';
  G.init();
  R.init(document.getElementById('c'));
  UI.init(document.getElementById('ui'));
  document.addEventListener('pointerdown', () => {
    screen.orientation?.lock?.('landscape').catch(() => {});
    try { navigator.storage?.persist?.().catch(() => {}); } catch (e) {} // iOS não limpa o save; sem aviso se negar
  }, { once: true, capture: true });
  let last = performance.now(), raf = 0;
  function loop(now){
    raf = 0;
    if (document.hidden) return;
    raf = requestAnimationFrame(loop); // antes: um erro num quadro nao congela o jogo
    const dt = Math.min((now - last) / 1000, 0.05); last = now;
    try { if (!window.UI?.paused) { G.update(dt); R.draw(G); } window.SFX?.draw(G); UI.draw(G); } catch (e) { erro(e); }
  }
  let errEl = null, errN = 0;
  function erro(e) { // mostra o 1o erro (para print) e segue jogando
    console.error(e);
    if (errN++) return;
    const l = String(e && e.stack || '').split('\n').find(s => /\.js:\d+/.test(s)) || '';
    errEl = document.createElement('div'); errEl.setAttribute('role', 'alert');
    errEl.style.cssText = 'position:fixed;left:50%;bottom:8px;transform:translateX(-50%);max-width:90vw;padding:6px 12px;border-radius:10px;background:rgba(43,34,54,.92);border:2px solid #ff5c57;color:#fff1e0;font:12px monospace;z-index:99;pointer-events:none';
    errEl.textContent = 'Erro (mande print): ' + (e && e.message) + ' ' + (l.match(/[\w-]+\.js:\d+/) || [''])[0];
    document.body.appendChild(errEl); setTimeout(() => errEl.remove(), 15000);
  }
  window.addEventListener('error', (ev) => erro(ev.error || ev));
  const salva = () => { try { G.save(); } catch (e) {} }; // celular mata aba em segundo plano: salva ao sair
  window.__salva = salva;
  addEventListener('pagehide', salva);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { salva(); cancelAnimationFrame(raf); raf = 0; return; }
    last = performance.now();
    if (!raf) raf = requestAnimationFrame(loop);
  });
  raf = requestAnimationFrame(loop);
</script>
<script>
// Tela tem de continuar acordada em partida; sem Wake Lock ou com erro: segue sem
let __wl = null; window.__emPartida = false;
window.__wake = (on) => { window.__emPartida = !!on; try { if (on) { if (!__wl && navigator.wakeLock) navigator.wakeLock.request('screen').then((l) => { __wl = l; l.addEventListener('release', () => { if (__wl === l) __wl = null; }); }).catch(() => {}); } else if (__wl) { const l = __wl; __wl = null; l.release().catch(() => {}); } } catch (e) {} };
document.addEventListener('visibilitychange', () => { if (!document.hidden && window.__emPartida) window.__wake(true); });
// Atualização: a versão nova baixa em segundo plano e só entra (reload) com a tela inicial aberta
if ('serviceWorker' in navigator && isSecureContext && (document.querySelector('meta[name=versao]') || {}).content !== '__VERSAO' + '__') {
  const had = !!navigator.serviceWorker.controller; let rl = false;
  window.__aplica = () => { const w = window.__sw && window.__sw.waiting; if (w) w.postMessage('go'); };
  const nova = () => { window.__nova = true; try { window.UI && UI.onNova && UI.onNova(); } catch (e) {} };
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (had && !rl) { rl = true; location.reload(); } });
  navigator.serviceWorker.register('sw.js').then((r) => {
    window.__sw = r;
    const olha = (w) => w && w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) nova(); });
    if (r.waiting && navigator.serviceWorker.controller) nova();
    r.addEventListener('updatefound', () => olha(r.installing));
    document.addEventListener('visibilitychange', () => { if (!document.hidden) r.update().catch(() => {}); });
  }).catch(() => {});
}
</script>
</body>
</html>
